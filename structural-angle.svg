<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Structural steel angle illustration</title>
  <desc id="desc">An original isometric illustration of a generic L-shaped structural steel angle. Illustrative, not a LAMCO product photograph or dimensional drawing.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafb"/><stop offset="1" stop-color="#e6ebef"/></linearGradient>
